<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crime Intel Suite — Karnataka State Police intelligence dashboard for crime analysis, hotspot detection, risk scoring, and offender network mapping." />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('crime-intel-theme') === 'light' ? 'light' : 'dark';
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>Crime Intel Suite — KSP Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
